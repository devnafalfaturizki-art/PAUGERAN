name: Security Audit
on:
  schedule: [{ cron: '0 3 * * 1' }]
  workflow_dispatch:
jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions-rust-lang/audit@v1
      - uses: pnpm/action-setup@v4
        with: { version: 9 }
      - run: pnpm audit --audit-level high
