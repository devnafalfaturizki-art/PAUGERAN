version: '3.8'

services:
  paugeran:
    build:
      context: ..
      dockerfile: docker/Dockerfile
    ports:
      - "3000:3000"
    volumes:
      - paugeran-data:/data
    environment:
      - DATA_DIR=/data
      - PORT=3000
      - AUTH_ENABLED=false
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3000/health"]
      interval: 30s
      timeout: 5s
      retries: 3

volumes:
  paugeran-data:
